name: CI/CD Monorepo → ECS (Frontend + Backend + MySQL)

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: despachos-cluster

jobs:
  deploy-backend:
    name: Build, Push & Deploy Backend + MySQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR con Maven
        working-directory: ./backend
        run: mvn -B -DskipTests package

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen Backend
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/backend-despachos:$IMAGE_TAG .
          docker push $ECR_REGISTRY/backend-despachos:$IMAGE_TAG
          docker tag $ECR_REGISTRY/backend-despachos:$IMAGE_TAG $ECR_REGISTRY/backend-despachos:latest
          docker push $ECR_REGISTRY/backend-despachos:latest
          echo "BACKEND_IMAGE=$ECR_REGISTRY/backend-despachos:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Descargar Task Definition backend
        run: |
          aws ecs describe-task-definition \
            --task-definition backend-con-mysql \
            --query taskDefinition \
            --region ${{ env.AWS_REGION }} | \
            jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection)' \
            > backend-task-definition.json

      - name: Actualizar imagen en Task Definition backend
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: backend
          image: ${{ env.BACKEND_IMAGE }}

      - name: Deploy Backend en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          service: backend-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

  deploy-frontend:
    name: Build, Push & Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen Frontend
        working-directory: ./frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/frontend-despacho:$IMAGE_TAG .
          docker push $ECR_REGISTRY/frontend-despacho:$IMAGE_TAG
          docker tag $ECR_REGISTRY/frontend-despacho:$IMAGE_TAG $ECR_REGISTRY/frontend-despacho:latest
          docker push $ECR_REGISTRY/frontend-despacho:latest
          echo "FRONTEND_IMAGE=$ECR_REGISTRY/frontend-despacho:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Descargar Task Definition frontend
        run: |
          aws ecs describe-task-definition \
            --task-definition frontend-despachos \
            --query taskDefinition \
            --region ${{ env.AWS_REGION }} | \
            jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection)' \
            > frontend-task-definition.json

      - name: Actualizar imagen en Task Definition frontend
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: frontend
          image: ${{ env.FRONTEND_IMAGE }}

      - name: Deploy Frontend en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-frontend.outputs.task-definition }}
          service: frontend-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Verificar despliegue completo
        run: |
          echo "✅ Deploy completo: Backend + MySQL + Frontend"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services frontend-service backend-service \
            --query 'services[*].{Servicio:serviceName,Corriendo:runningCount,Deseado:desiredCount}'
